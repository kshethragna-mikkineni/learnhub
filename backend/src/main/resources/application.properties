spring.datasource.url=jdbc:mysql://localhost:3306/learnhub?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-secret-before-deploying-0123456789abcdef}
app.jwt.ttl-minutes=120
app.cors.origin=http://localhost:5173

server.error.include-message=always
